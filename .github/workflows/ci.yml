name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/evaluate.py
      - name: Start Gradio app
        run: |
          uv run python app.py > /tmp/room.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/ > /dev/null
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check demo container
        run: |
          docker build -t decision-room .
          docker run -d --name decision-room -p 127.0.0.1:7860:7860 decision-room
          trap 'docker logs decision-room; docker rm -f decision-room' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/ > /dev/null
