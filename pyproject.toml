[project]
name = "ai-decision-room"
version = "0.1.0"
description = "A transparent multi-model workspace for difficult technical decisions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "litellm>=1.79,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
